<svg width="200" height="200" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .sider-stroke { stroke: #000000; }
    .sider-fill { fill: #000000; }
    @media (prefers-color-scheme: dark) {
      .sider-stroke { stroke: #ffffff; }
      .sider-fill { fill: #ffffff; }
    }
  </style>

  <!-- Outer Circular Compass & Precision Ticks -->
  <circle
    cx="24"
    cy="24"
    r="22"
    class="sider-stroke"
    stroke-width="1"
    stroke-dasharray="1.5 2.5"
    opacity="0.45"
  />
  <circle
    cx="24"
    cy="24"
    r="20"
    class="sider-stroke"
    stroke-width="1.25"
  />

  <!-- 4 Precision Cardinal Ticks -->
  <line x1="24" y1="0.5" x2="24" y2="3.5" class="sider-stroke" stroke-width="1.5" stroke-linecap="round" />
  <line x1="24" y1="44.5" x2="24" y2="47.5" class="sider-stroke" stroke-width="1.5" stroke-linecap="round" />
  <line x1="0.5" y1="24" x2="3.5" y2="24" class="sider-stroke" stroke-width="1.5" stroke-linecap="round" />
  <line x1="44.5" y1="24" x2="47.5" y2="24" class="sider-stroke" stroke-width="1.5" stroke-linecap="round" />

  <!-- Architectural Faceted 'S' (LSM-Tree Silicon Prism) -->
  <!-- Tier 1: MemTable Ingestion & Upper Diamond -->
  <path
    d="M 14 14.5 L 24 9 L 34 14.5 L 34 20.5 L 29.5 23 L 29.5 17 L 24 14 L 18.5 17 L 14 14.5 Z"
    class="sider-fill"
  />

  <!-- Tier 2: WAL Nexus (Central Hexagonal Bridge) -->
  <path
    d="M 18.5 19.5 L 24 16.5 L 29.5 19.5 L 29.5 25 L 24 28 L 18.5 25 Z"
    class="sider-stroke"
    stroke-width="1.2"
    fill="none"
    stroke-dasharray="2 2"
    opacity="0.65"
  />

  <!-- Tier 3: Central Diagonal Spine -->
  <path
    d="M 29.5 22.5 L 24 25.5 L 18.5 22.5 L 14 25 L 18.5 27.5 L 24 24.5 L 29.5 27.5 L 34 25 L 29.5 22.5 Z"
    class="sider-fill"
  />

  <!-- Tier 4: SSTable Disk Foundation Bar -->
  <path
    d="M 14 27.5 L 18.5 25 L 18.5 31 L 24 34 L 29.5 31 L 34 33.5 L 24 39 L 14 33.5 Z"
    class="sider-fill"
  />

  <!-- Core Silicon Crystal Anchor -->
  <circle cx="24" cy="24" r="1.75" class="sider-fill" />
</svg>
